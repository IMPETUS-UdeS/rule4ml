on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.11']
        tf-version: ['2.15.1', '2.17.0']
        include:
          - os: ubuntu-latest
            python-version: '3.12'
            tf-version: '2.17.0'
          - os: ubuntu-latest
            python-version: '3.12'
            tf-version: '2.19.1'

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up uv and Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v10.3.3
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    - name: Install dependencies
      run: |
        uv lock --check
        uv venv .venv
        uv pip install --python .venv/bin/python --torch-backend cpu -e ".[keras]" --group dev "tensorflow==${{ matrix.tf-version }}"
        uv pip check --python .venv/bin/python

    - name: Run tests
      run: |
        uv run --no-sync pytest tests > tests/test_results-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.tf-version }}.log

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test_results-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.tf-version }}
        path: tests/test_results-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.tf-version }}.log

    - name: Report failed tests
      if: failure()
      run: |
        echo "Some tests failed. Check the test log for more details."

  torch-only:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: astral-sh/setup-uv@v10.3.3
      with:
        python-version: '3.13'
        enable-cache: true
    - name: Install base dependencies
      run: |
        uv venv .venv
        uv pip install --python .venv/bin/python --torch-backend cpu -e . --group dev --group onnx-export
    - name: Run tests without Keras
      run: uv run --no-sync pytest tests

  notebooks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: astral-sh/setup-uv@v10.3.3
      with:
        python-version: '3.12'
        enable-cache: true
    - name: Install dependencies
      run: |
        uv venv .venv
        uv pip install --python .venv/bin/python --torch-backend cpu -e . --group dev --group notebooks
    - name: Keep the smallest dataset family in notebook 2
      run: sed -i 's/families = \[[^]]*\]/families = [\\"2_20\\"]/' notebooks/02_train_and_evaluate.ipynb
    - name: Run tutorial notebooks
      run: uv run --no-sync pytest --nbmake notebooks/01_predict.ipynb notebooks/02_train_and_evaluate.ipynb

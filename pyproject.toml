[build-system]
requires = ["setuptools>=77", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "rule4ml"
dynamic = ["version"]
description = "Resource utilization and Latency Estimation for ML on FPGA"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "IMPETUS Team", email = "impetus@usherbrooke.ca" }]
requires-python = ">=3.11,<3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy",
    "pandas",
    "torch",
    "torch-geometric",
    "tqdm",
]

[project.optional-dependencies]
keras = ["tensorflow>=2.15.1,<2.20", "keras"]
onnx = ["onnx"]

[dependency-groups]
dev = ["nbmake", "pre-commit", "pytest"]
onnx-export = ["rule4ml[onnx]", "onnxscript"]  # onnx needs a newer ml-dtypes than TF 2.17
notebooks = ["huggingface_hub", "ipykernel", "matplotlib"]
datagen = [
    "rule4ml[keras]",
    "hls4ml",
    "quantizers<2",
    "psutil",
    "py-cpuinfo",
    "pyparsing",
]

[tool.setuptools.packages.find]
include = ["rule4ml*"]

[tool.setuptools_scm]
version_file = "rule4ml/_version.py"

[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
version_file = "rule4ml/_version.py"

[tool.ruff]
target-version = "py39"
extend-exclude = ["hls4ml"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-third-party = ["hls4ml"]
